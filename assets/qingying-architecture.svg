<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">清影系统架构</title>
  <desc id="desc">清影由桌面客户端、端侧智能处理引擎和远端授权运营服务构成，媒体数据保留在用户设备内。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9FBFD"/>
      <stop offset="1" stop-color="#F2F7F9"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2877B8"/>
      <stop offset="1" stop-color="#1D5F94"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20A99A"/>
      <stop offset="1" stop-color="#128276"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17354D" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6A8293"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; }
      .heading { font-size: 27px; font-weight: 700; fill: #142C3E; }
      .subtitle { font-size: 14px; fill: #63798A; }
      .zone-title { font-size: 18px; font-weight: 700; fill: #203A4C; }
      .zone-note { font-size: 12px; fill: #6A8191; }
      .card-title { font-size: 17px; font-weight: 700; fill: #183247; }
      .card-note { font-size: 13px; fill: #607788; }
      .module { font-size: 13px; font-weight: 700; fill: #29485D; }
    </style>
  </defs>

  <rect x="1" y="1" width="1278" height="698" rx="22" fill="url(#canvas)" stroke="#DCE7ED"/>
  <text x="48" y="50" class="eyebrow" fill="#2877B8">QINGYING ARCHITECTURE</text>
  <text x="48" y="86" class="heading">端云协同的媒体处理架构</text>
  <text x="48" y="114" class="subtitle">媒体计算在用户设备内完成，云端提供账号、授权、额度、公告与版本服务</text>

  <rect x="40" y="142" width="790" height="510" rx="20" fill="#F7FBFE" stroke="#BFD8E8" stroke-width="1.5"/>
  <rect x="850" y="142" width="390" height="510" rx="20" fill="#F7FCFB" stroke="#C5E1DA" stroke-width="1.5"/>

  <circle cx="70" cy="179" r="7" fill="#2877B8"/>
  <text x="89" y="185" class="zone-title">用户设备 · 本地可信边界</text>
  <text x="588" y="184" class="zone-note">视频 / 音频 / 文稿 / 导出文件</text>

  <circle cx="880" cy="179" r="7" fill="#20A99A"/>
  <text x="899" y="185" class="zone-title">授权与运营服务</text>
  <text x="1113" y="184" class="zone-note">业务元数据</text>

  <g filter="url(#shadow)">
    <rect x="80" y="214" width="710" height="105" rx="16" fill="#FFFFFF" stroke="#C8DDEB"/>
    <rect x="80" y="214" width="8" height="105" rx="4" fill="url(#blue)"/>
    <text x="118" y="254" class="card-title">清影桌面客户端</text>
    <text x="118" y="281" class="card-note">Electron 主进程 · React 工作台 · IPC 任务协调</text>
    <rect x="603" y="239" width="153" height="52" rx="12" fill="#EBF4FA"/>
    <text x="679.5" y="261" text-anchor="middle" font-size="12" font-weight="700" fill="#2877B8">用户交互层</text>
    <text x="679.5" y="280" text-anchor="middle" font-size="11" fill="#597487">导入 · 复核 · 导出</text>
  </g>

  <line x1="435" y1="319" x2="435" y2="355" stroke="#6A8293" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="365" width="710" height="208" rx="16" fill="#FFFFFF" stroke="#BCD8EA"/>
    <rect x="80" y="365" width="8" height="208" rx="4" fill="url(#blue)"/>
    <text x="118" y="405" class="card-title">清影端侧智能处理引擎</text>
    <text x="118" y="430" class="card-note">任务编排 · 状态管理 · 安全校验</text>

    <rect x="112" y="463" width="195" height="76" rx="12" fill="#F0F6FA" stroke="#D7E5ED"/>
    <circle cx="137" cy="489" r="7" fill="#2877B8"/>
    <text x="155" y="494" class="module">语音识别</text>
    <text x="137" y="519" font-size="12" fill="#607788">PyTorch · FunASR</text>

    <rect x="337" y="463" width="195" height="76" rx="12" fill="#F0F6FA" stroke="#D7E5ED"/>
    <circle cx="362" cy="489" r="7" fill="#2877B8"/>
    <text x="380" y="494" class="module">候选复核</text>
    <text x="362" y="519" font-size="12" fill="#607788">定位 · 边界 · 音频保护</text>

    <rect x="562" y="463" width="195" height="76" rx="12" fill="#F0F6FA" stroke="#D7E5ED"/>
    <circle cx="587" cy="489" r="7" fill="#2877B8"/>
    <text x="605" y="494" class="module">媒体导出</text>
    <text x="587" y="519" font-size="12" fill="#607788">FFmpeg · 结果校验</text>
  </g>

  <rect x="150" y="599" width="570" height="34" rx="17" fill="#EAF3F8"/>
  <text x="435" y="621" text-anchor="middle" font-size="13" font-weight="700" fill="#496A80">本地缓存 · 任务状态 · 应用配置 · 媒体产物</text>

  <path d="M790 260 C830 260 830 260 873 260" fill="none" stroke="#1B8B7F" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <rect x="801" y="230" width="58" height="22" rx="11" fill="#FFFFFF" stroke="#CFE4DF"/>
  <text x="830" y="245" text-anchor="middle" font-size="10" font-weight="700" fill="#17786E">HTTPS</text>

  <g filter="url(#shadow)">
    <rect x="890" y="214" width="310" height="96" rx="16" fill="#FFFFFF" stroke="#C7E0DA"/>
    <rect x="890" y="214" width="8" height="96" rx="4" fill="url(#teal)"/>
    <text x="928" y="251" class="card-title">授权 API</text>
    <text x="928" y="278" class="card-note">账号 · 设备 · 额度 · 任务票据</text>
  </g>

  <line x1="1045" y1="310" x2="1045" y2="345" stroke="#6A8293" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="890" y="355" width="310" height="96" rx="16" fill="#FFFFFF" stroke="#C7E0DA"/>
    <rect x="890" y="355" width="8" height="96" rx="4" fill="url(#teal)"/>
    <text x="928" y="392" class="card-title">运营管理后台</text>
    <text x="928" y="419" class="card-note">客户 · 套餐 · 公告 · 发布 · 审计</text>
  </g>

  <line x1="1045" y1="451" x2="1045" y2="486" stroke="#6A8293" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="890" y="496" width="310" height="88" rx="16" fill="#FFFFFF" stroke="#C7E0DA"/>
    <rect x="890" y="496" width="8" height="88" rx="4" fill="url(#teal)"/>
    <text x="928" y="532" class="card-title">业务数据与审计</text>
    <text x="928" y="559" class="card-note">SQLite · 备份 · 完整性检查</text>
  </g>

  <g transform="translate(896 607)">
    <path d="M0 8 L8 5 L16 8 V15 C16 22 11 27 8 29 C5 27 0 22 0 15 Z" fill="#E7F6F2" stroke="#178779" stroke-width="1.5"/>
    <path d="M4.5 16.5 L7 19 L12 13.5" fill="none" stroke="#178779" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="21" font-size="12" font-weight="700" fill="#3C7069">不接收媒体文件与识别文稿</text>
  </g>
</svg>
